# Netlify build configuration for this static Astro site.
# Netlify hosting is provisioned via `stripe projects add netlify/project`.
#
# Two ways to deploy:
#   1. Connect this repo in the Netlify UI — it reads this file automatically.
#   2. Run `npm run deploy` locally — uses NETLIFY_AUTH_TOKEN + NETLIFY_SITE_ID
#      from your .env (provisioned by Stripe Projects) to push the built `dist/`.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
