# Registry manifest for the Stripe Projects template registry.
#
# Copy this file into stripe/projects-template-registry at
#   static_site/astro-portfolio-blog.yaml
# and open a PR. Update `repo` to this template's public GitHub URL and pin
# `ref` to the exact commit you want users to receive. Bumping `ref` later does
# not affect existing users until you update it.

guided:
  category: static_site
  framework: astro

template: posthog/astro-portfolio-blog
variant: cobalt-hedgehog
default: true
variant_description: PostHog • Algolia • Supabase • Netlify
install_command: npm install

metadata:
  name: Astro Portfolio + Blog
  description: Personal site with a landing page, portfolio, and blog — analytics, search, contact form, and hosting wired in.
  owner: posthog
  tags:
    - Astro
    - Blog
    - Portfolio
    - Static site

repo: https://github.com/PostHog/stripe-projects-astro-static-template
ref: a04ed0af920b484bcfa30588072a0c82e843c567

services:
  - posthog/analytics
  - algolia/application
  - supabase/project
  - netlify/project

next_steps:
  - label: Run locally
    command: npm run dev
  - label: Create the contact-form table
    command: supabase db execute --file supabase/schema.sql
  - label: Index blog posts for search
    command: npm run index
  - label: Deploy to Netlify
    command: npm run deploy

tier_plans:
  posthog/analytics:
    free_lowest_cost: PostHog/free
    starter_paid: PostHog/pay-as-you-go
    higher_scale: PostHog/pay-as-you-go
  algolia/application:
    free_lowest_cost: Algolia/build
    starter_paid: Algolia/grow
    higher_scale: Algolia/premium
  supabase/project:
    free_lowest_cost: Supabase/free
    starter_paid: Supabase/pro
    higher_scale: Supabase/pro
  netlify/project:
    free_lowest_cost: Netlify/free
    starter_paid: Netlify/pro
    higher_scale: Netlify/pro
